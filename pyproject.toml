[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stockdata"
version = "0.1.0"
description = "Free daily dataset (Alpaca prices + SEC EDGAR shares/sector) for backtesting a US momentum strategy"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["stockdata"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
